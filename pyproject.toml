[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "embodiedsense"
version = "0.1.0"
description = "Traceable RGB-D synchronization, quality diagnostics and 3D projection"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["numpy>=2.1,<3", "opencv-python-headless>=4.10,<5", "pyyaml>=6,<7", "psutil>=6,<8"]

[project.optional-dependencies]
viz = ["rerun-sdk>=0.24,<0.30"]
lerobot = ["pyarrow>=15,<30"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pyarrow>=15,<30"]

[project.scripts]
embodiedsense = "embodiedsense.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
